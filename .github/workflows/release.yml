name: Release

on:
  push:
    tags:
      - "codex-account-switcher-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Apple Silicon target
        if: matrix.name == 'macOS Apple Silicon'
        run: rustup target add aarch64-apple-darwin

      - name: Add macOS Intel target
        if: matrix.name == 'macOS Intel'
        run: rustup target add x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is missing. Tauri updater artifacts cannot be signed."
            exit 1
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: codex-account-switcher-v__VERSION__
          releaseName: CodexSwitcher v__VERSION__
          releaseBody: |
            Download the installer or bundle for your platform from the assets below.

            These builds are unsigned by default. On macOS, Gatekeeper may show "CodexSwitcher is damaged and can't be opened". This usually means the app is not Apple-notarized.

            Workaround for unsigned macOS builds:
            ```bash
            xattr -dr com.apple.quarantine ~/Downloads/CodexSwitcher_*.dmg
            open ~/Downloads/CodexSwitcher_*.dmg
            ```
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

  verify-updater-manifest:
    name: Verify updater manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Wait for latest.json
        shell: bash
        run: |
          endpoint="https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --location --silent --show-error "$endpoint" --output latest.json; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::Updater manifest was not published at $endpoint"
              exit 1
            fi
            sleep 10
          done
          node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("latest.json","utf8")); if(!data.version || !data.platforms || !Object.keys(data.platforms).length) throw new Error("latest.json is missing version or platforms"); console.log(`verified updater manifest ${data.version}`)'
