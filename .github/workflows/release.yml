name: Release

on:
  push:
    tags:
      - "codex-account-switcher-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install protoc
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            ubuntu-22.04)
              sudo apt-get install -y protobuf-compiler
              ;;
            macos-latest)
              brew install protobuf || brew upgrade protobuf
              ;;
            windows-latest)
              choco install protoc -y --no-progress
              ;;
          esac
          protoc --version

      - name: Install Windows Packet.lib (build-time only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "WpdPack_4_1_2"
          $archive = Join-Path $env:RUNNER_TEMP "WpdPack_4_1_2.zip"
          curl.exe --fail --location --retry 5 `
            --user-agent "CodexSwitcher-Release/1.0" `
            --output $archive `
            "https://www.winpcap.org/install/bin/WpdPack_4_1_2.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf) -or (Get-Item -LiteralPath $archive).Length -lt 100000) {
            throw "WpdPack download is missing or unexpectedly small: $archive"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $packetLibDir = Join-Path $root "WpdPack\Lib\x64"
          $packetLib = Join-Path $packetLibDir "Packet.lib"
          if (-not (Test-Path -LiteralPath $packetLib)) {
            throw "Packet.lib was not found at $packetLib"
          }
          $runtimeDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri\easytier\third_party\x86_64"
          $packetDll = Join-Path $runtimeDir "Packet.dll"
          if (-not (Test-Path -LiteralPath $packetDll -PathType Leaf)) {
            throw "Bundled Packet.dll was not found at $packetDll"
          }
          New-Item -ItemType Directory -Path $runtimeDir -Force | Out-Null
          Write-Host "Packet.dll: $packetDll"
          "LIB=$packetLibDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Packet.lib: $packetLib"

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require("fs");
          const tag = process.env.RELEASE_TAG;
          const prefix = "codex-account-switcher-v";
          if (!tag.startsWith(prefix)) {
            throw new Error(`Unexpected release tag: ${tag}`);
          }
          const version = tag.slice(prefix.length);
          const packageVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const tauriVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const cargoToml = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargoToml.match(/^version = "([^"]+)"/m)?.[1];
          const versions = { packageVersion, tauriVersion, cargoVersion };
          for (const [name, value] of Object.entries(versions)) {
            if (value !== version) {
              throw new Error(`${name} ${value} does not match release tag ${tag}`);
            }
          }
          console.log(`release tag ${tag} matches package, Tauri, and Cargo versions`);
          NODE

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Apple Silicon target
        if: matrix.name == 'macOS Apple Silicon'
        run: rustup target add aarch64-apple-darwin

      - name: Add macOS Intel target
        if: matrix.name == 'macOS Intel'
        run: rustup target add x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is missing. Tauri updater artifacts cannot be signed."
            exit 1
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: CodexSwitcher v__VERSION__
          releaseBody: |
            ## 0.1.39 更新内容

            ### 新增
            - 支持多个独立分享组同时加入和运行。
            - 分享组支持设备授权、撤销、恢复和按设备设置同步范围。
            - 账号迁移支持选择单个、多个或部分账号。

            ### 优化与修复
            - 分享组使用独立运行实例、虚拟网段和代理端口，互不影响。
            - 保存分享内容后，账号同步立即触发；规则、API 和会话仍按需手动同步。
            - 修复迁移账号选择区和迁移选项布局问题。

            请从下方 Assets 下载对应平台的安装包。

            macOS 构建默认未经过 Apple 公证。如系统提示应用已损坏，可执行：
            ```bash
            xattr -dr com.apple.quarantine ~/Downloads/CodexSwitcher_*.dmg
            open ~/Downloads/CodexSwitcher_*.dmg
            ```
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

  verify-updater-manifest:
    name: Finalize updater manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Merge platform artifacts into latest.json
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const prefix = "codex-account-switcher-v";
            if (!tag.startsWith(prefix)) {
              core.setFailed(`Unexpected release tag: ${tag}`);
              return;
            }

            const version = tag.slice(prefix.length);
            const { owner, repo } = context.repo;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            let release;
            for (let attempt = 1; attempt <= 6; attempt++) {
              try {
                ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
                break;
              } catch (error) {
                if (error.status !== 404 || attempt === 6) throw error;
                core.info(`Release ${tag} is not visible yet; retrying (${attempt}/6)`);
                await sleep(10000);
              }
            }
            const assets = release.assets;

            const requireAsset = (pattern, label) => {
              const asset = assets.find((item) => pattern.test(item.name));
              if (!asset) throw new Error(`Missing ${label} release asset`);
              return asset;
            };
            const signatureFor = async (bundle) => {
              const signature = assets.find((item) => item.name === `${bundle.name}.sig`);
              if (!signature) throw new Error(`Missing ${bundle.name}.sig release asset`);
              const response = await github.rest.repos.getReleaseAsset({
                owner,
                repo,
                asset_id: signature.id,
                headers: { accept: "application/octet-stream" }
              });
              return Buffer.from(response.data).toString("utf8").trim();
            };
            const entry = async (bundle) => ({
              url: `https://github.com/${owner}/${repo}/releases/download/${tag}/${bundle.name}`,
              signature: await signatureFor(bundle)
            });

            const windows = requireAsset(/_x64-setup\.exe$/, "Windows NSIS updater");
            const linux = requireAsset(/_amd64\.AppImage$/, "Linux AppImage updater");
            const macIntel = requireAsset(/_x64\.app\.tar\.gz$/, "macOS Intel updater");
            const macArm = requireAsset(/_aarch64\.app\.tar\.gz$/, "macOS Apple Silicon updater");
            const windowsEntry = await entry(windows);
            const linuxEntry = await entry(linux);
            const macIntelEntry = await entry(macIntel);
            const macArmEntry = await entry(macArm);
            const manifest = {
              version,
              notes: release.body || "",
              pub_date: release.published_at,
              platforms: {
                "windows-x86_64": windowsEntry,
                "linux-x86_64": linuxEntry,
                "darwin-x86_64": macIntelEntry,
                "darwin-x86_64-app": macIntelEntry,
                "darwin-aarch64": macArmEntry,
                "darwin-aarch64-app": macArmEntry
              }
            };
            const contents = Buffer.from(`${JSON.stringify(manifest, null, 2)}\n`);
            const previous = assets.find((item) => item.name === "latest.json");
            if (previous) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: previous.id });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: "latest.json",
              data: contents,
              headers: {
                "content-type": "application/json",
                "content-length": contents.length
              }
            });
            core.info(`Published updater manifest ${version} for ${Object.keys(manifest.platforms).join(", ")}`);

      - name: Verify latest.json
        shell: bash
        run: |
          endpoint="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.json"
          curl --fail --location --silent --show-error "$endpoint" --output latest.json
          node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("latest.json","utf8")); for (const target of ["windows-x86_64", "linux-x86_64", "darwin-x86_64", "darwin-aarch64"]) if (!data.platforms?.[target]?.url || !data.platforms[target].signature) throw new Error(`latest.json is missing ${target}`); console.log(`verified complete updater manifest ${data.version}`)'
