name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.3"
          repo-token: ${{ github.token }}

      - name: Install Windows Packet.lib (build-time only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "WpdPack_4_1_2"
          $archive = Join-Path $env:RUNNER_TEMP "WpdPack_4_1_2.zip"
          curl.exe --fail --location `
            --retry 8 --retry-all-errors --retry-delay 5 `
            --connect-timeout 30 --max-time 300 `
            --user-agent "CodexSwitcher-CI/1.0" `
            --output $archive `
            "https://www.winpcap.org/install/bin/WpdPack_4_1_2.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf) -or (Get-Item -LiteralPath $archive).Length -lt 100000) {
            throw "WpdPack download is missing or unexpectedly small: $archive"
          }
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $packetLibDir = Join-Path $root "WpdPack\Lib\x64"
          $packetLib = Join-Path $packetLibDir "Packet.lib"
          if (-not (Test-Path -LiteralPath $packetLib -PathType Leaf)) {
            throw "Packet.lib was not found at $packetLib"
          }
          "LIB=$packetLibDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Packet.lib: $packetLib"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test
