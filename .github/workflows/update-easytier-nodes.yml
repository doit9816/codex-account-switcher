name: Update EasyTier nodes

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and normalize nodes
        run: node scripts/update-easytier-nodes.cjs

      - name: Publish changed JSON
        run: |
          if git diff --quiet -- easytier-nodes.json; then
            echo "No node changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add easytier-nodes.json
          git commit -m "chore: update EasyTier nodes"
          git push
